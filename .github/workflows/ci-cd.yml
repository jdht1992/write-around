name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.12"

    services:
      postgres:
        # Pin to an immutable SHA — never trust :latest or even :15 alone
        image: postgres:15@sha256:98fe06b500b5eb29e45bf8c073eb0ca399790ce17b1d586448edc4203627d342
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: write_around_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # Pin to an immutable SHA
        image: redis:7@sha256:976ab0f0939b78c06d802bcd3bea44c5142ea9a756a57b861e08819817f768c8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        # actions/checkout@v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true          # caches the uv package cache across runs

      - name: Set up Python
        run: uv python install ${PYTHON_VERSION}

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run linter (ruff)
        run: uv run ruff check .
      
      # ── Hadolint: Lint the Dockerfile ────────────────────────────────────
      - name: Run Dockerfile Linter (hadolint)
        # uses: hadolint/hadolint-action@v3.1.0
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning  # Fails the build on warnings or errors

      - name: Run test
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/write_around_db
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest --cov=app --cov-fail-under=60 --junitxml=pytest-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-results
          path: pytest-results.xml

# ─────────────────────────────────────────
# JOB: CodeQL — Static Analysis (SAST)
# ─────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ python ]
        # python-version: [3.10, 3.11, 3.12]

    permissions:
      actions: read
      contents: read
      security-events: write   # required to upload results to Security tab
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: ${{ matrix.language }}
          # Optional: use extended query suite for broader coverage
          queries: security-extended


      # For interpreted languages like Python, CodeQL can autobuild.
      # No manual build step needed.
      - name: Autobuild
        uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          category: codeql-python
          output: codeql-results.sarif
# ─────────────────────────────────────────
# JOB 2: Build, Scan, Push & Sign
# ─────────────────────────────────────────
  build_scan_and_push:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, codeql]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      security-events: write  # required to upload SARIF to GitHub Security tab
      packages: write          # CRITICAL: Allows pushing/pulling intermediate images to GHCR
      id-token: write         # CRITICAL: Enables OIDC keyless authentication for Cosign
      attestations: write     # 👈 CRITICAL: Fixes "Resource not accessible by integration"    
    outputs:
      # Expose the immutable digest for downstream deploy jobs
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d586dba76842633160b90ff13307931c438ec12e # v4.0.0

      # Streamlined: Build and load locally so Trivy can scan it BEFORE pushing
      - name: Build Docker image locally
        uses: docker/build-push-action@24e9b7e65fa9b24032c509eea5591c9f61aa18e6 # v6.18.0
        with:
          context: .
          load: true # Puts it in the local runner daemon for scanning
          tags: ghcr.io/${{ github.repository_owner }}/fastapi_write_around:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy: scan the local image before it ever reaches the registry ──
      - name: Trivy — image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fastapi_write_around:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1             # hard gate — push is blocked if this fails
      
      # ── Trivy: scan repo files and dependencies ───────────────────────────
      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: 0 # non-blocking — findings go to Security tab only


      # Upload both SARIF reports — runs even if a scan step fails
      - name: Upload image scan → GitHub Security tab
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Upload filesystem scan → GitHub Security tab
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      # Log to GHCR to enable caching and optional push to GHCR (can be used as a backup registry)
      - name: Log in to GitHub Container Registry(GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # 6. Push final verified image to GHCR (Only reached if scan passes)
      - name: Build and push intermediate image to GHCR
        id: push
        uses: docker/build-push-action@24e9b7e65fa9b24032c509eea5591c9f61aa18e6 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fastapi_write_around:latest
            ghcr.io/${{ github.repository_owner }}/fastapi_write_around:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Only reached if the image scan passed (exit-code: 1 above)
 
      - name: Print pushed digest
        run: echo "Pushed digest -> ${{ steps.push.outputs.digest }}"

      # ─────────────────────────────────────────────────────────────────
      # SUPPLY CHAIN SECURITY INTEGRATIONS (GHCR ONLY)
      # ─────────────────────────────────────────────────────────────────

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0

      - name: Generate SBOM with Syft
        run: |
          # FIXED: Added the '-q' (quiet) flag to prevent terminal rendering pollution in the JSON file
          syft -q ghcr.io/${{ github.repository_owner }}/fastapi_write_around:${{ github.sha }} -o spdx-json=sbom.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Generate Build Attestation and Sign
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fastapi_write_around
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM like artifact of workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
        with:
          name: sbom
          path: sbom.spdx.json
