services:
  app:
    build: .
    container_name: write-around-app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: write-around-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data_postgres_write_around:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: write-around-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - data_redis_write_around:/data

volumes:
  data_postgres_write_around:
  data_redis_write_around:
